Syntax 4

SectionVerb {
	EnableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' on"
		cset "name='TX_AIF1_CAP Mixer DEC0' on"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='TX0 MODE' ADC_LP"
		cset "name='ADC1_MIXER Switch' on"
		cset "name='ADC1 Volume' 12"
		cset "name='ADC1 Switch' on"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' on,on"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' off"
		cset "name='TX_AIF1_CAP Mixer DEC0' off"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1_MIXER Switch' off"
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' off,off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback (AW88261 via PRIMARY_MI2S)"

	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' on,on"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' off,off"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Mic" {
	Comment "Handset AMIC1 via TX_CODEC_DMA_TX_3 (Aurora handset-mic/amic1)"

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
